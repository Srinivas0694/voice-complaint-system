; VoiceComplaintSystem — ESP32-S3 firmware
; Prototype target: ESP32-S3-DevKitC-1 (N16R8), USB powered, no battery.

[platformio]
default_envs = prototype

[env]
platform  = espressif32@6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.partitions           = partitions.csv
; N16R8 = 16 MB quad flash + 8 MB OCTAL PSRAM. The stock esp32-s3-devkitc-1
; manifest describes an N8 with no PSRAM, so every one of these is required.
board_build.arduino.memory_type  = qio_opi
board_build.flash_mode           = qio
board_build.psram_type           = opi
board_upload.flash_size          = 16MB
board_upload.maximum_size        = 16777216

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    fastled/FastLED @ ^3.6.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11

; ─────────────────────────────────────────────────────────────
; Prototype: bench build. Secrets live in secrets.ini (gitignored).
; Copy secrets.ini.example → secrets.ini and fill it in.
; ─────────────────────────────────────────────────────────────
[env:prototype]
extra_scripts = pre:load_secrets.py
build_flags =
    ${env.build_flags}
    -DFW_VERSION='"1.0.0"'
    -DHW_REVISION='"VCS-S3-PROTO"'
    -DPROTOTYPE_BUILD=1
    -DTLS_INSECURE=1          ; skip cert validation on the bench — NEVER in production
    -DLOG_LEVEL=4             ; 0=NONE 1=ERROR 2=WARN 3=INFO 4=DEBUG

; ─────────────────────────────────────────────────────────────
; Bench diagnostic: bridges the USB monitor straight to the A9G's UART so you
; can type AT commands by hand. Sweeps baud rates on boot.
;   pio run -e a9gbridge -t upload
; ─────────────────────────────────────────────────────────────
[env:a9gbridge]
build_src_filter = -<*> +<../tools/a9g_bridge/main.cpp>
lib_deps =
build_flags =
    ${env.build_flags}
    -DFW_VERSION='"bridge"'

[env:production]
extra_scripts = pre:load_secrets.py
build_flags =
    ${env.build_flags}
    -DFW_VERSION='"1.0.0"'
    -DHW_REVISION='"VCS-S3-REV-A"'
    -DLOG_LEVEL=2
